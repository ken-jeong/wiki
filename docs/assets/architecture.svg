    <text x="24" y="264" class="body">draft 검사 · 폴더 구조 그대로 복사</text>
    <text x="24" y="315" class="role">content/</text>
    <text x="24" y="346" class="body">C0~C8 · P2 · R1 · 홈 index.md</text>
  </g>
