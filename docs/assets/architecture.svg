    <g class="icon" transform="translate(32 32)" aria-hidden="true"><rect x="9" y="4" width="32" height="40" rx="4"/><path d="M17 4v40M23 14h11M23 22h11M23 30h7"/></g>
    <text x="104" y="63" class="label">01 | 노트 작성</text>
    <text x="24" y="126" class="heading">Obsidian Vault</text>
    <text x="24" y="154" class="subtitle">iCloud 동기화 vault · Markdown</text>
    <text x="24" y="181" class="subtitle">프런트매터 draft: false로 공개</text>
