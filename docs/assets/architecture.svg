    <text x="24" y="126" class="heading">Quartz 4 빌드</text>
    <text x="24" y="154" class="subtitle">Node.js 22 · TypeScript</text>
    <text x="24" y="181" class="subtitle">npx quartz build · ko-KR</text>
    <path d="M24 200H376" stroke="#DBDEE3"/>
