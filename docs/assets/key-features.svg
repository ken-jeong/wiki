    <text x="24" y="257" class="body">위키링크 · 콜아웃 · KaTeX 수식</text>
    <text x="24" y="315" class="role">읽기 도구</text>
    <text x="24" y="346" class="body">링크 미리보기 · 다크·리더 모드</text>
